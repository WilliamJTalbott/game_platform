<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 252" width="180" height="252">
  <!-- No background rect/border here — the card face is the .playing-card div,
       see playing_card.css. This is ink only, same as the rank/suit faces.

       An 8-petal sunburst medallion in the accent coral, alternating a bright
       and a deep tone for depth, framed by a thin ring and simple corner dots. -->

