  <path d="M90,50  C101,80  101,106 90,126 C79,106  79,80  90,50  Z"  fill="#cf4817" fill-opacity="0.55" transform="rotate(225 90 126)"/>
  <path d="M90,50  C101,80  101,106 90,126 C79,106  79,80  90,50  Z"  fill="#f0784c" fill-opacity="0.85" transform="rotate(270 90 126)"/>
  <path d="M90,50  C101,80  101,106 90,126 C79,106  79,80  90,50  Z"  fill="#cf4817" fill-opacity="0.55" transform="rotate(315 90 126)"/>

  <circle cx="90" cy="126" r="17" fill="none" stroke="#f0784c" stroke-width="1.3"/>
  <text x="90" y="127" font-family="Georgia, serif" font-size="16" fill="#f0784c" text-anchor="middle" dominant-baseline="middle">&#9830;</text>

  <circle cx="24" cy="30" r="2.4" fill="#f0784c" opacity="0.55"/>
