  <path d="M90,50  C101,80  101,106 90,126 C79,106  79,80  90,50  Z"  fill="#f0784c" fill-opacity="0.85" transform="rotate(90 90 126)"/>
  <path d="M90,50  C101,80  101,106 90,126 C79,106  79,80  90,50  Z"  fill="#cf4817" fill-opacity="0.55" transform="rotate(135 90 126)"/>
